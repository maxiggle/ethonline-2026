version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chapter2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chapter2
      POSTGRES_PASSWORD: chapter2_secret
      POSTGRES_DB: chapter2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapter2 -d chapter2_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
