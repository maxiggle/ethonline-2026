services:
  - type: web
    name: chapter2-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /mandates/active
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: chapter2-postgres
          property: connectionString
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: CHAIN_ID
        value: "84532"
      - key: SAFE_ADDRESS
        value: 0x4f712dd78Cb1a504C69CB4f68B82Fddb6b3b1df6
      - key: GUARD_ADDRESS
        value: 0x9b6023D1B6D3b076C8d999Ba406AE486750ce7d3
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: PRIVY_APP_ID
        value: cmtxqm6nq004l0clgqp0hhtoz
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_CLIENT_ID
        value: client-WY6d91ucEvtodyQkHGWv2VUFCbvHoyDFU91nDg3XhUvxP
      - key: PORT
        value: "10000"

databases:
  - name: chapter2-postgres
    plan: free
    databaseName: chapter2_db
    user: chapter2
    region: oregon
